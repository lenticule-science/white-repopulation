# Pandoc build settings shared by every output format.
bibliography: references/references.yaml
csl: references/chicago-author-date.csl
nocite: "@*"
link-citations: true
toc: true
toc-depth: 2
lang: en-US
papersize: letter
geometry: margin=1in
fontsize: 11pt
mainfont: TeX Gyre Pagella
sansfont: TeX Gyre Heros
monofont: DejaVu Sans Mono
colorlinks: true
linkcolor: wrlink
urlcolor: wrlink
citecolor: wrlink
# A fixed PDF trailer /ID: with SOURCE_DATE_EPOCH this makes the XeLaTeX PDF
# byte-reproducible on the pinned toolchain.
header-includes:
  - '\definecolor{wrlink}{HTML}{2A78D6}'
  - '\special{pdf:trailerid [<57686974655265706f70756c6174696f> <57686974655265706f70756c6174696f>]}'
