# A tag vX.Y.Z publishes that exact build: the paper in every format, its
# build receipt and PROV-O provenance, the data package, and SHA-256 sums.
# Zenodo (if enabled for this repository) archives the release and mints a DOI.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: white-repopulation
          path: build
      - name: Version in paper.yaml must equal the tag
        run: |
          version=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' paper.yaml)
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "paper.yaml version ${version} != tag ${GITHUB_REF_NAME}"; exit 1; }
      - name: Assemble release assets
        run: |
          cp datapackage.json build/
          tar -czf build/white-repopulation-data.tar.gz datapackage.json data/ LICENSES/ REUSE.toml
          cd build && sha256sum -- * > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/* \
            --title "White Repopulation ${GITHUB_REF_NAME}" \
            --notes-file <(sed -n "/^## \[${GITHUB_REF_NAME#v}\]/,/^## \[/p" CHANGELOG.md | sed '$d') \
            --verify-tag
