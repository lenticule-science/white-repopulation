# Build the paper and its data package for independent verification.
name: release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: white-repopulation
          path: build
      - name: Assemble release assets
        run: |
          cp datapackage.json build/
          tar -czf build/white-repopulation-data.tar.gz datapackage.json data/ LICENSES/ REUSE.toml
          cd build && sha256sum -- * > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: white-repopulation-release
          path: build/
