# Every push and pull request: reproduce every number, figure and metadata file,
# validate the ontology and records, check licensing, and build the paper.
# All tooling is Red Cup Engineering's, pinned by commit in package.json and below.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  # secrets cannot appear in a step's `if:`; route the optional token through env.
  SERVICES_TOKEN: ${{ secrets.SERVICES_TOKEN }}
  CONFORMANCE_SERVICE: git+https://github.com/red-cup-engineering/rdf-vocabulary-conformance-service@9dc0e77e9b165d61969b2146e78bdac0f74ac749

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The Engineering services are private until the release gate; a read
      # token for them is supplied as SERVICES_TOKEN. Public, it is unneeded.
      - name: Authenticate to Red Cup Engineering service repositories
        if: env.SERVICES_TOKEN != ''
        run: git config --global url."https://x-access-token:${SERVICES_TOKEN}@github.com/red-cup-engineering/".insteadOf "https://github.com/red-cup-engineering/"
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install "${CONFORMANCE_SERVICE}"
      - name: Claims, figures, metadata, ontology and records
        run: make check
      - name: REUSE licensing
        uses: fsfe/reuse-action@bb774aa972c2a89ff34781233d275075cbddf542 # v5.0.0

  paper:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # Ubuntu 24.04 ships pandoc 3.1.3 and TeX Live 2023, the toolchain
      # manuscript.json requires; a different toolchain changes PDF bytes.
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc texlive-xetex texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended fonts-texgyre fonts-dejavu librsvg2-bin lmodern jq
      - name: Authenticate to Red Cup Engineering service repositories
        if: env.SERVICES_TOKEN != ''
        run: git config --global url."https://x-access-token:${SERVICES_TOKEN}@github.com/red-cup-engineering/".insteadOf "https://github.com/red-cup-engineering/"
      - run: npm ci --no-audit --no-fund
      - name: Build paper and PROV-O provenance
        run: make paper provenance
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: white-repopulation
          path: |
            build/white-repopulation.*
            build/receipt.json
            build/prov.*
          if-no-files-found: error
